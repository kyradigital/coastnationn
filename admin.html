<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coast Nation — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ---------- PIN screen ---------- -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-card" id="pinCard">
    <div class="brand" style="justify-content:center;margin-bottom:6px">
      <div class="brand-mark">CN</div>
      <div><span data-brand-name>Coast Nation</span><span class="sub">Admin Dashboard</span></div>
    </div>
    <p class="muted small" style="margin-top:14px">Enter your access PIN</p>
    <div class="pin-dots" id="pinDots"></div>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off"
           style="text-align:center;letter-spacing:.4em;font-size:1.1rem" placeholder="••••••••••">
    <div class="keypad" id="keypad"></div>
    <button class="btn btn-primary btn-block" id="pinGo" style="margin-top:14px">Unlock</button>
    <p class="small muted" style="margin:16px 0 0"><a href="index.html">← Back to the public site</a></p>
  </div>
</div>

<!-- ---------- Admin shell ---------- -->
<div class="admin-shell hidden" id="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CN</div>
      <div><span data-brand-name>Coast Nation</span><span class="sub">Admin Dashboard</span></div>
    </div>
    <nav class="side-nav" id="sideNav">
      <button data-tab="dash" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        Dashboard</button>
      <button data-tab="events">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        Events &amp; tickets</button>
      <button data-tab="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h2.2l1.5 10.2a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 2-1.6L20 8H6.3"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        Purchases</button>
      <button data-tab="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7.5 15.5l3.5-4.2 3 2.4 4.5-6"/></svg>
        Analytics</button>
      <button data-tab="checkin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>
        Gate check-in</button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        Settings</button>
    </nav>
    <div style="margin-top:22px;display:flex;flex-direction:column;gap:8px">
      <a class="btn btn-ghost btn-sm" href="index.html" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>
        View public site</a>
      <button class="btn btn-soft btn-sm" id="lockBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Lock</button>
    </div>
  </aside>

  <main class="admin-main" id="main"></main>
</div>

<div id="modalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
