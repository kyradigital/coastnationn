<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coast Nation — Event tickets in Kenya</title>
<meta name="description" content="Buy tickets online for the best events on the Kenyan coast. Instant QR tickets straight to your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topbar" id="topbar"></header>

<section class="hero">
  <div class="hero-media" aria-hidden="true">
    <video id="heroVideo" autoplay muted loop playsinline preload="metadata"
           poster="assets/video/hero-poster.jpg">
      <source src="assets/video/hero.mp4" type="video/mp4">
      <source src="assets/video/hero.webm" type="video/webm">
    </video>
    <div class="hero-scrim"></div>
  </div>
  <div class="wrap hero-content">
    <h1>Tickets for the best<br>events on the coast.</h1>
    <p class="lead">Pay online, get your QR ticket instantly, walk straight in. No queues, no paper, no stress.</p>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="filters">
      <button class="chip active" data-filter="upcoming">Upcoming</button>
      <button class="chip" data-filter="all">All events</button>
      <button class="chip" data-filter="month">This month</button>
      <button class="chip" data-filter="past">Past</button>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search events, venues, towns…">
      </div>
    </div>

    <div class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/public.js"></script>
</body>
</html>
